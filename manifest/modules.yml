# Manifesto de módulos — Laguna PE-77/2026 × i-Educar 2.12
# Fonte canônica espelhada do monorepo: packages/buriti (CatalogoModulos + REPOS-IEDUCAR-ORG.md)
# Atualizado: 2026-11-25

core:
  repo: https://github.com/i-Educar/i-educar
  branch: "2.12"
  php: ">=8.3"
  laravel: "13"
  database: postgresql
  cache: redis

setup:
  comando: laguna:setup
  povoar: laguna:povoar-cidade
  check: laguna:check
  pacote: buriti/i-educar-laguna-ambiente-package
  ui_docs: packages/buriti/docs/UI-MODULOS-LAGUNA.md

modules:
  - tr: "4.x"
    name: exportacao-unificada
    composer: buriti/i-educar-exportacao-unificada-package
    path: packages/buriti/i-educar-exportacao-unificada-package
    repo: https://github.com/i-Educar/i-educar-exportacao-unificada-package
    onda: 0
    required_for_poc: true
    comandos: [exportacao:demo, exportacao:demo-criticos]

  - tr: "5.3"
    name: escolar-aderencia
    composer: buriti/i-educar-escolar-aderencia-package
    path: packages/buriti/i-educar-escolar-aderencia-package
    repo: https://github.com/i-Educar/i-educar-escolar-aderencia-package
    onda: 1
    required_for_poc: true
    comandos: [escolar:onda1-demo]

  - tr: "5.4"
    name: transporte-escolar-v2
    composer: buriti/i-educar-transporte-escolar-v2
    path: packages/buriti/i-educar-transporte-escolar-v2
    repo: https://github.com/i-Educar/i-educar-transporte-escolar-v2-package
    onda: 1
    required_for_poc: true
    comandos: [transporte:simula, transporte:passagem-empenho-demo]
    rotas: [/transporte-escolar]

  - tr: "5.8"
